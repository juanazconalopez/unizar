name: Publicación automática

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wait:
    name: Agrupar cambios durante 10 minutos
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message || '', 'chore(version): v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: unizar-release-wait
      cancel-in-progress: true
    steps:
      - name: Esperar por si llegan más commits
        run: sleep 600

  publish:
    name: Validar y preparar release
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # Una publicación en marcha termina; las esperas de nuevos pushes son independientes.
    concurrency:
      group: unizar-release-publish
      cancel-in-progress: false
    env:
      UNIZAR_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Comprobar si sigue pendiente este commit
        id: candidate
        run: node scripts/automaticRelease.ts check
      - name: Instalar dependencias del lockfile
        if: steps.candidate.outputs.ready == 'true'
        run: npm ci
      - name: Preparar la versión siguiente
        if: steps.candidate.outputs.ready == 'true'
        id: version
        run: node scripts/automaticRelease.ts prepare
      - name: Pruebas
        if: steps.version.outputs.ready == 'true'
        run: npm test -- --run --maxWorkers=2
      - name: ESLint
        if: steps.version.outputs.ready == 'true'
        run: npm run lint
      - name: Build y presupuesto de arranque
        if: steps.version.outputs.ready == 'true'
        env:
          # Solo se usan para validar el build. Cloudflare conserva sus variables reales.
          VITE_SUPABASE_URL: https://supabase.test
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm run build
      - name: Comprobar espacios del diff
        if: steps.version.outputs.ready == 'true'
        run: git diff --check
      - name: Enviar la publicación a release
        if: steps.version.outputs.ready == 'true'
        env:
          UNIZAR_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          UNIZAR_PREVIOUS_RELEASE_SHA: ${{ steps.version.outputs.previous_release_sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/automaticRelease.ts publish
