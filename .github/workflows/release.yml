name: Publicación automática

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Validar y preparar release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    # Una publicación en marcha termina y comprueba de nuevo el último SHA antes de enviar.
    concurrency:
      group: unizar-release-publish
      cancel-in-progress: false
    env:
      UNIZAR_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Comprobar commit y versión
        id: candidate
        run: node scripts/automaticRelease.ts prepare
      - name: Instalar dependencias del lockfile
        if: steps.candidate.outputs.ready == 'true'
        run: npm ci
      - name: Pruebas
        if: steps.candidate.outputs.ready == 'true'
        run: npm test -- --run --maxWorkers=2
      - name: ESLint
        if: steps.candidate.outputs.ready == 'true'
        run: npm run lint
      - name: Build y presupuesto de arranque
        if: steps.candidate.outputs.ready == 'true'
        env:
          # Solo se usan para validar el build. Cloudflare conserva sus variables reales.
          VITE_SUPABASE_URL: https://supabase.test
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm run build
      - name: Tipos y build de la demo
        if: steps.candidate.outputs.ready == 'true'
        run: |
          npx tsc -p demo.local/tsconfig.json
          npx vite build --config demo.local/vite.config.ts
      - name: Instalar navegadores de Playwright
        if: steps.candidate.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright de la demo (escritorio y móvil)
        if: steps.candidate.outputs.ready == 'true'
        run: npm run test:e2e -- --workers=2 --forbid-only
      - name: Playwright de navegación (escritorio y móvil)
        if: steps.candidate.outputs.ready == 'true'
        run: npx playwright test --config playwright.navigation.config.ts --workers=2 --forbid-only
      - name: Comprobar espacios del diff
        if: steps.candidate.outputs.ready == 'true'
        run: git diff --check
      - name: Enviar la publicación a release
        if: steps.candidate.outputs.ready == 'true'
        env:
          UNIZAR_RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          UNIZAR_PREVIOUS_RELEASE_SHA: ${{ steps.candidate.outputs.previous_release_sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/automaticRelease.ts publish
