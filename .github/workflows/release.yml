name: Publicación automática

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Validar y preparar release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # Una publicación en marcha termina y comprueba de nuevo el último SHA antes de enviar.
    concurrency:
      group: unizar-release-publish
      cancel-in-progress: false
    env:
      UNIZAR_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        id: node
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Comprobar commit y versión
        id: candidate
        run: node scripts/automaticRelease.ts prepare
      - name: Identificar dependencias sin la versión de la aplicación
        if: steps.candidate.outputs.ready == 'true'
        id: dependencies
        run: node scripts/ciCacheKey.ts >> "$GITHUB_OUTPUT"
      - name: Caché de descargas de npm
        if: steps.candidate.outputs.ready == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: npm-v1-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ steps.dependencies.outputs.fingerprint }}
          restore-keys: |
            npm-v1-${{ runner.os }}-${{ steps.node.outputs.node-version }}-
      - name: Instalar dependencias del lockfile
        if: steps.candidate.outputs.ready == 'true'
        run: npm ci --prefer-offline --no-fund
      - name: Caché de ESLint y TypeScript
        if: steps.candidate.outputs.ready == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: |
            node_modules/.cache/eslint
            node_modules/.tmp/tsconfig.app.tsbuildinfo
            node_modules/.tmp/tsconfig.node.tsbuildinfo
          key: checks-v1-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ steps.dependencies.outputs.fingerprint }}-${{ hashFiles('eslint.config.js', 'tsconfig*.json', 'scripts/ciCacheKey.ts') }}-${{ github.sha }}
          restore-keys: |
            checks-v1-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ steps.dependencies.outputs.fingerprint }}-${{ hashFiles('eslint.config.js', 'tsconfig*.json', 'scripts/ciCacheKey.ts') }}-
      - name: ESLint
        if: steps.candidate.outputs.ready == 'true'
        run: npm run lint -- --cache --cache-strategy content --cache-location node_modules/.cache/eslint
      - name: Build y presupuesto de arranque
        if: steps.candidate.outputs.ready == 'true'
        env:
          # Solo se usan para validar el build. Cloudflare conserva sus variables reales.
          VITE_SUPABASE_URL: https://supabase.test
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm run build
      - name: Comprobar espacios del diff
        if: steps.candidate.outputs.ready == 'true'
        run: git diff --check
      - name: Enviar la publicación a release
        if: steps.candidate.outputs.ready == 'true'
        env:
          UNIZAR_RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          UNIZAR_PREVIOUS_RELEASE_SHA: ${{ steps.candidate.outputs.previous_release_sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/automaticRelease.ts publish
