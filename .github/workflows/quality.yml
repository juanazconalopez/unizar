name: Comprobaciones

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar las dependencias del lockfile
        run: npm ci
      - name: Pruebas
        run: npm test -- --run --maxWorkers=2
      - name: ESLint
        run: npm run lint
      - name: Build y presupuesto de arranque
        run: npm run build
      - name: Tipos y build de la demo
        run: |
          npx tsc -p demo.local/tsconfig.json
          npx vite build --config demo.local/vite.config.ts
      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright de la demo (escritorio y móvil)
        run: npm run test:e2e -- --workers=2 --forbid-only
      - name: Playwright de navegación (escritorio y móvil)
        run: npx playwright test --config playwright.navigation.config.ts --workers=2 --forbid-only
      - name: Comprobar espacios del diff
        run: git diff --check
