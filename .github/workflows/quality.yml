name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar las dependencias del lockfile
        run: npm ci
      - name: Pruebas
        run: npm test -- --run --maxWorkers=2
      - name: ESLint
        run: npm run lint
      - name: Build y presupuesto de arranque
        run: npm run build
      - name: Comprobar espacios del diff
        run: git diff --check
